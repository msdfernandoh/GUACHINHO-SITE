<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"><title>Redefinir senha</title></head>
  <body style="font-family:Arial,sans-serif;color:#172033;line-height:1.5">
    <h2>Redefinição de senha</h2>
    <p>Recebemos uma solicitação para redefinir a senha de acesso ao Gauchinho Consórcios.</p>
    <p><a href="https://www.gauchinhoconsorcios.com.br/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery">Criar nova senha</a></p>
    <p>Se você não fez esta solicitação, ignore este e-mail. Sua senha atual continuará válida.</p>
    <p>Por segurança, o link só pode ser usado uma vez e expira automaticamente.</p>
  </body>
</html>
